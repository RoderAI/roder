[package]
name = "roder-ext-hopper"
version = "0.1.0"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[package.metadata.roder.distribution]
id = "hopper"
category = "inference-engine"
display_name = "Hopper"
description = "Hopper API-key inference provider (fast open-source models) using OpenAI-compatible Chat Completions."
default_in_profiles = []
required_env = []
optional_env = [
    "HOPPER_API_KEY",
    "RODER_HOPPER_API_KEY",
    "HOPPER_BASE_URL",
    "RODER_HOPPER_BASE_URL",
]
conflicts_with = []
required_capabilities = ["network.api.withhopper.com"]
extension_path = "::HopperExtension::new"
docs_url = "https://docs.withhopper.com"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
roder-api.workspace = true
roder-config.workspace = true
roder-ext-openai-chat-completions.workspace = true
semver.workspace = true

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "io-util", "net", "sync"] }
