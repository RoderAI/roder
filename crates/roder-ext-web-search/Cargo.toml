[package]
name = "roder-ext-web-search"
version = "0.3.1"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[package.metadata.roder.distribution]
id = "web-search"
category = "tool-provider"
display_name = "Web Search Router"
description = "Router extension for configured web search providers."
default_in_profiles = ["full"]
required_env = []
optional_env = []
conflicts_with = []
required_capabilities = ["network.web"]
extension_path = "::WebSearchRouterExtension::new"
docs_url = ""

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
roder-api.workspace = true
roder-ext-firecrawl-search = { workspace = true, optional = true }
roder-ext-parallel-search = { workspace = true, optional = true }
roder-ext-perplexity-search = { workspace = true, optional = true }
roder-ext-synthetic-search = { workspace = true, optional = true }
roder-ext-tavily-search.workspace = true
roder-web-search.workspace = true
semver.workspace = true
serde_json.workspace = true

[features]
# Tavily is always built in; the other backends are opt-in.
firecrawl = ["dep:roder-ext-firecrawl-search"]
parallel = ["dep:roder-ext-parallel-search"]
perplexity = ["dep:roder-ext-perplexity-search"]
synthetic = ["dep:roder-ext-synthetic-search"]

[dev-dependencies]
tokio.workspace = true
