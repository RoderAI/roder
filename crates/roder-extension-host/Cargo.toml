readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
futures.workspace = true
roder-api.workspace = true
roder-codex-auth.workspace = true
roder-code-index.workspace = true
roder-config.workspace = true
roder-context.workspace = true
roder-ext-anthropic = { workspace = true, optional = true }
roder-ext-browser-use = { workspace = true, optional = true }
roder-ext-chrome = { workspace = true, optional = true }
roder-ext-cua = { workspace = true, optional = true }
roder-ext-jev = { workspace = true, optional = true }
roder-ext-claude-code = { workspace = true, optional = true }
roder-ext-cursor = { workspace = true, optional = true }
