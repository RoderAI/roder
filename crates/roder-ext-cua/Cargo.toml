[package]
name = "roder-ext-cua"
version = "0.1.0"
edition.workspace = true
description = "Linux runner and local macOS desktop computer use through Cua Driver"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
png.workspace = true
roder-api.workspace = true
roder-config.workspace = true
semver.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "process", "io-util"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "3"
roder-ext-runner-blaxel.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
