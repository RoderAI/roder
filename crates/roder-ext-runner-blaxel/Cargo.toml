[package]
name = "roder-ext-runner-blaxel"
version = "0.2.1"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
reqwest = { workspace = true, features = ["json"] }
# Port configuration uses the published 0.2.2 runner contract. Do not force
# consumers to upgrade their independently pinned hosted ownership stack.
roder-api = { path = "../roder-api", version = "0.2.9" }
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
urlencoding.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread", "time"] }
