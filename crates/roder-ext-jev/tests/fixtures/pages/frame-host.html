<!doctype html>
<html>
<head><meta charset="utf-8"><title>Framed offer</title></head>
<body>
  <!-- Frames the address in ?src=, large enough to read: another port on
       the same host is another origin of the same site, so the frame stays
       in the page's process. -->
  <h1>Partner offer</h1>
  <iframe id="offer" style="width: 460px; height: 220px"></iframe>
  <script>
    document.getElementById('offer').src = new URLSearchParams(location.search).get('src');
  </script>
</body>
</html>
