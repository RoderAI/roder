<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
  <h1>Sign in</h1>
  <!-- A form that submits by GET to a page that echoes its address: a
       password holding "@", a space, "&" or a quote lands there
       percent-encoded ("%40", "+", "%26", "%22") and, in the page's JSON
       echo, escaped. -->
  <form method="get" action="signed-in.html">
    <label>Username <input type="text" name="username" autocomplete="username"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
