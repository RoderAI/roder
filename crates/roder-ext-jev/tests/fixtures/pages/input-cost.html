<!doctype html>
<html>
<head><meta charset="utf-8"><title>Input cost</title></head>
<body>
  <h1>Input cost</h1>
  <!-- A still page with one plain button and one plain field, so timing an
       act measures the input path and nothing the page does. -->
  <button type="button" onclick="window.clicks = (window.clicks || 0) + 1">Count</button>
  <label>Note <input type="text" name="note"></label>
</body>
</html>
