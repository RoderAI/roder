<!doctype html>
<html>
<head><meta charset="utf-8"><title>Security settings</title></head>
<body>
  <h1>Security settings</h1>
  <!-- A password change: "Save" names nothing, but its form sets a new
       password. With the gate on, an unauthorized run must stop before it
       whatever the model says. -->
  <form method="post" action="/submit/password">
    <label>New password <input type="password" name="new" autocomplete="new-password"></label>
    <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password"></label>
    <button type="submit">Save</button>
  </form>
</body>
</html>
