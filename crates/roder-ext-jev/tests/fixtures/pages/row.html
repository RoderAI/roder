<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Row with a nested button</title>
  <style>
    .row { display: flex; justify-content: center; align-items: center;
           width: 600px; height: 60px; border: 1px solid #888; margin: 20px; cursor: pointer; }
    .delete { width: 120px; height: 40px; }
  </style>
</head>
<body>
  <h1>Invoices</h1>
  <!-- The row opens the invoice; the Delete button nested at its centre
       takes its own click. -->
  <div class="row" role="button" aria-label="Open invoice 42"
       onclick="window.opened = (window.opened || 0) + 1">
    <button type="button" class="delete"
            onclick="event.stopPropagation(); window.deleted = (window.deleted || 0) + 1">Delete</button>
  </div>
</body>
</html>
