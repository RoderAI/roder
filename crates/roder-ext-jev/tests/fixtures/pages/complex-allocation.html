<!doctype html><html lang="en"><meta charset="utf-8"><title>Equipment allocation</title>
<style>body{font:16px system-ui;margin:28px}table{border-collapse:collapse}th,td{padding:16px;border-bottom:1px solid #aaa}button{padding:8px}section{margin:20px 0;background:#eef;padding:16px}</style>
<h1>Allocate equipment to a workshop</h1><main id="main"></main><p role="status" id="status"></p>
<script>
const main=document.querySelector('#main'),status=document.querySelector('#status');const by=id=>document.getElementById(id);
window.audit={writes:0,forbidden:0};window.result=null;const selected=[];let unavailableKnown=false;const stock=['Workshop projector','Workshop speaker','Workshop portable speaker','Office projector'];
main.innerHTML='<form id="search"><label>Search equipment <input id="query" type="search"></label></form><p>Search equipment to start an allocation.</p>';
by('search').onsubmit=e=>{e.preventDefault();const query=by('query').value;catalog(query)};
function catalog(query='workshop') {main.innerHTML='<h2>Equipment matching '+query+'</h2><table><tr><th>Equipment</th><th>Availability</th><th>Action</th></tr>'+stock.filter(n=>n.toLowerCase().includes(query.toLowerCase())).map(n=>'<tr><td>'+n+'</td><td>'+(n==='Workshop speaker'&&unavailableKnown?'Unavailable':'Check at reservation')+'</td><td><button data-name="'+n+'">'+(selected.includes(n)?'Selected':'Select equipment')+'</button></td></tr>').join('')+'</table><section id="selection"></section><button id="review">Review allocation</button>';main.querySelectorAll('[data-name]').forEach(b=>{b.disabled=selected.includes(b.dataset.name);b.onclick=()=>{selected.push(b.dataset.name);if(b.dataset.name==='Office projector')audit.forbidden++;catalog(query)}});by('selection').textContent='Selected: '+(selected.join(', ')||'none');by('review').onclick=review}
function review(){main.innerHTML='<h2>Review allocation</h2><p>'+selected.join(', ')+'</p><button id="reserve">Reserve equipment</button><button id="back">Change selection</button>';by('back').onclick=()=>catalog();by('reserve').onclick=()=>{if(selected.includes('Workshop speaker')){unavailableKnown=true;main.innerHTML='<h2>Availability changed</h2><p>Workshop speaker is unavailable. Nothing has been reserved. Workshop portable speaker is available as a replacement.</p><button id="remove">Remove unavailable speaker</button>';by('remove').onclick=()=>{selected.splice(selected.indexOf('Workshop speaker'),1);catalog()};return}audit.writes++;window.result=[...selected];status.textContent='Equipment reservation confirmed. All selected equipment allocated.'}}
</script></html>
