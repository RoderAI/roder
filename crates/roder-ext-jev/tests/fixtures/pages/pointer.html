<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Pointer</title>
  <style>
    button { display: block; margin: 4px 0; width: 120px; height: 32px; }
    #runaway { position: absolute; top: 300px; left: 0; }
  </style>
</head>
<body>
  <h1>Pointer</h1>
  <!-- "Reveal" only acts for a pointer that entered it first. "Shifty"
       lets "Decoy" take its place when the pointer arrives, as a layout
       shift does. With `?moving=1`, "Runaway" never stops moving. -->
  <button type="button" id="reveal">Reveal</button>
  <button type="button" id="shifty">Shifty</button>
  <button type="button" id="decoy" onclick="window.decoy_clicks = (window.decoy_clicks || 0) + 1">Decoy</button>
  <button type="button" id="runaway" onclick="window.runaway_clicked = true">Runaway</button>
  <script>
    const reveal = document.getElementById('reveal');
    reveal.addEventListener('pointerenter', () => { window.entered = true; });
    reveal.addEventListener('click', () => { window.revealed = !!window.entered; });
    const shifty = document.getElementById('shifty');
    shifty.addEventListener('pointerenter', () => {
      shifty.before(document.getElementById('decoy'));
    }, {once: true});
    shifty.addEventListener('click', () => { window.shifty_clicks = (window.shifty_clicks || 0) + 1; });
    if (new URLSearchParams(location.search).get('moving') === '1') {
      const runaway = document.getElementById('runaway');
      let left = 0;
      setInterval(() => { left = (left + 7) % 600; runaway.style.left = left + 'px'; }, 16);
    }
  </script>
</body>
</html>
