<!doctype html>
<html>
<head><meta charset="utf-8"><title>Counter</title></head>
<body>
  <h1>Counter</h1>
  <!-- Every click visibly changes the page, so only the action budget ends
       a run that keeps clicking. -->
  <p>Count: <output id="total">0</output></p>
  <button type="button" id="add">Add one</button>
  <script>
    window.count = 0;
    document.getElementById('add').addEventListener('click', () => {
      document.getElementById('total').textContent = ++window.count;
    });
  </script>
</body>
</html>
