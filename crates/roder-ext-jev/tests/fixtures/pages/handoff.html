<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Find trains</title>
  <style>
    .field { position: relative; width: 260px; height: 32px; }
    .field input { position: absolute; inset: 0; width: 100%; box-sizing: border-box; font: 16px sans-serif; }
    #from-editor { z-index: 2; border: 2px solid #06c; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Find trains</h1>
  <!-- An airport-picker style field: pressing "From" swaps in an editor
       right over it that takes focus a moment later, and only the editor's
       value is posted. Typing where the click landed reaches nothing.
       `focus_ms` sets how late the editor takes focus. With `on_type=1` the
       editor opens on the first keystroke instead, swallowing it, as some
       search boxes do. `refuse=1` makes the "Promo code" field wipe
       whatever is typed into it. -->
  <form method="post" action="/submit/trains">
    <div class="field">
      <input id="from" aria-label="From" autocomplete="off">
      <input id="from-editor" name="from" aria-label="From station" autocomplete="off" hidden>
    </div>
    <label>Promo code <input id="promo" name="promo" autocomplete="off"></label>
    <button type="submit">Search</button>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    const focusMs = Number(params.get('focus_ms') || 150);
    const from = document.getElementById('from');
    const editor = document.getElementById('from-editor');
    const open = () => {
      editor.hidden = false;
      from.style.visibility = 'hidden';
    };
    if (params.get('on_type') === '1') {
      from.addEventListener('input', () => {
        from.value = '';
        open();
        editor.focus();
      });
    } else {
      from.addEventListener('mousedown', () => {
        open();
        setTimeout(() => editor.focus(), focusMs);
      });
    }
    if (params.get('refuse') === '1') {
      const promo = document.getElementById('promo');
      promo.addEventListener('input', () => { promo.value = ''; });
    }
  </script>
</body>
</html>
