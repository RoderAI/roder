<!doctype html>
<html>
<head><meta charset="utf-8"><title>Framed button</title></head>
<body style="margin:0">
  <button id="go" type="button" style="font-size:28px;padding:10px 30px;margin:20px">?</button>
  <script>
    const label = new URLSearchParams(location.search).get('label') || 'Go';
    const button = document.getElementById('go');
    button.textContent = label;
    button.addEventListener('click', () => {
      try { window.top.document.getElementById('status').textContent = label + ' clicked.'; }
      catch { button.textContent = label + ' clicked'; }
      window.clicked = (window.clicked || 0) + 1;
    });
  </script>
</body>
</html>
