<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Account check</title>
<style> body { font: 15px sans-serif; margin: 8px; } </style></head>
<body>
  <h1>Account check</h1>
  <!-- A password field, and a button that shows back what was typed in it,
       as a "show password" toggle or an error echo would: a secret on screen
       that a screenshot must not carry. -->
  <label>Password <input type="password" id="pw" autocomplete="current-password"></label>
  <button type="button" id="show">Show what I typed</button>
  <p id="echo"></p>
  <script>
    document.getElementById('show').addEventListener('click', () => {
      document.getElementById('echo').textContent = 'You typed: ' + document.getElementById('pw').value;
    });
  </script>
</body>
</html>
