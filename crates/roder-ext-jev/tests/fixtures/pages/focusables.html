<!doctype html>
<html>
<head><meta charset="utf-8"><title>Settings</title>
<style>div, pre { margin: 8px; padding: 4px; } [role=slider] { width: 120px; height: 12px; background: #ccc; }</style>
</head>
<body>
  <h1>Settings</h1>
  <!-- Focusable, but not clickable: a slider, a tab panel and a code block
       each with tabindex=0. The tile is only a tabindex too, and is kept. -->
  <div role="slider" tabindex="0" aria-label="Volume" aria-valuenow="3"></div>
  <div role="tabpanel" tabindex="0">General settings panel</div>
  <pre tabindex="0">npm install jev</pre>
  <div tabindex="0" style="width: 120px">Weekly digest</div>
</body>
</html>
