<!doctype html><html lang="en"><meta charset="utf-8"><title>Room reservations</title>
<style>body{font:16px system-ui;margin:32px;max-width:760px}label{display:block;margin:16px}button{padding:10px;margin:8px}aside{background:#eee;padding:16px}</style>
<h1>Reserve a meeting room</h1><aside id="summary">No reservation has been made.</aside><main id="main"></main><p role="status" id="status"></p>
<script>
const main=document.querySelector('#main'),status=document.querySelector('#status'),summary=document.querySelector('#summary');
window.audit={writes:0,forbidden:0};window.result=null;const draft={};const by=id=>document.getElementById(id);
main.innerHTML='<h2>Organizer</h2><form id="form"><label>Organizer name <input id="name"></label><label>Department <select id="department"><option>Finance</option><option>Engineering</option><option>Customer support</option></select></label><button>Choose room and time</button></form>';
by('form').onsubmit=e=>{e.preventDefault();draft.organizer=by('name').value;draft.department=by('department').value;main.innerHTML='<h2>Schedule</h2><form id="form"><label>Room <select id="room"><option>Juniper</option><option>Willow</option></select></label><label>Meeting date <input id="date" placeholder="YYYY-MM-DD"></label><label>Start time <select id="time"><option>09:00</option><option>14:30</option></select></label><label>Attendees <input id="attendees" inputmode="numeric"></label><button>Review reservation</button></form>';by('form').onsubmit=e=>{e.preventDefault();Object.assign(draft,{room:by('room').value,date:by('date').value,time:by('time').value,attendees:by('attendees').value,notes:''});review()}};
function review(){summary.textContent=JSON.stringify(draft);main.innerHTML='<h2>Review reservation</h2><p>Reservation is not confirmed yet.</p><p>Additional instructions: '+(draft.notes||'None')+'</p><button id="notes">Edit additional instructions</button><button id="confirm">Confirm reservation</button><button id="cancel">Cancel request</button>';by('cancel').onclick=()=>{audit.forbidden++;status.textContent='Request cancelled.'};by('notes').onclick=()=>{main.innerHTML='<h2>Additional instructions</h2><form id="form"><label>Additional instructions <input id="instructions"></label><button>Apply instructions</button></form>';by('form').onsubmit=e=>{e.preventDefault();draft.notes=by('instructions').value;review()}};by('confirm').onclick=()=>{audit.writes++;window.result={...draft};status.textContent='Room reservation confirmed. Reference R-617.'}}
</script></html>
