<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Trip search</title>
  <style>
    #suggest { position: absolute; background: #fff; border: 1px solid #ccc; margin: 0; padding: 2px; }
    #suggest li { list-style: none; cursor: pointer; padding: 2px; }
  </style>
</head>
<body>
  <!-- What an action did, as the step's effect says it (effects.rs): a
       submit the form refuses for a required field still empty, a send a
       script refuses by marking a field invalid, an autocomplete whose
       chosen suggestion leaves the typed text as it was, a suggestion that
       sets nothing, a ticket type the page ignores while it redraws its
       fares, and a link to a page that is not there. -->
  <h1>Trip search</h1>
  <form id="trip" action="/pages/results.html" method="get">
    <label>Depart <input name="depart" required value="Oct 20"></label>
    <label>Return <input name="return" required></label>
    <label>Where from? <input id="from" name="from" autocomplete="off"></label>
    <ul id="suggest" hidden></ul>
    <button type="submit">Search</button>
  </form>
  <p>Ticket type</p>
  <ul role="listbox" aria-label="Ticket type">
    <li role="option" aria-selected="true" id="round">Round trip</li>
    <li role="option" aria-selected="false" id="one">One way</li>
  </ul>
  <p id="fares">Fares shown for round trips.</p>
  <form id="contact" novalidate>
    <label>Email <input id="email" type="email"></label>
    <button type="button" id="send">Send</button>
  </form>
  <p id="sent"></p>
  <p><a href="/pages/gone.html">Old offers</a></p>
  <script>
    const from = document.getElementById('from');
    const suggest = document.getElementById('suggest');
    const places = ['London, United Kingdom', 'Londrina, Brazil', 'Nowhere at all'];
    from.addEventListener('input', () => {
      suggest.innerHTML = '';
      for (const place of places) {
        const item = document.createElement('li');
        item.textContent = place;
        // Choosing London leaves the field as typed; the last does nothing.
        item.onclick = () => {
          if (place.startsWith('London')) from.value = 'London';
          suggest.hidden = true;
        };
        suggest.append(item);
      }
      suggest.hidden = !from.value;
    });
    // The page ignores the ticket type, but redraws its fares every time.
    let redraws = 0;
    document.getElementById('one').onclick = () => {
      redraws += 1;
      document.getElementById('fares').textContent = `Fares refreshed ${redraws} times.`;
    };
    document.getElementById('send').onclick = () => {
      const email = document.getElementById('email');
      if (!email.value.trim()) email.setAttribute('aria-invalid', 'true');
      else document.getElementById('sent').textContent = 'Sent';
    };
  </script>
</body>
</html>
