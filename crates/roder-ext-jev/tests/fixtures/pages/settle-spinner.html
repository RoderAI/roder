<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>Endless search</title>
  <style>
    .spinner { width: 24px; height: 24px; border: 3px solid #ccc; border-top-color: #333;
      border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Endless search</h1>
  <button type="button" id="search">Search</button>
  <div id="status"></div>
  <script>
    // The spinner is drawn once and animated in CSS: it never mutates the
    // DOM, and nothing ever replaces it.
    document.getElementById('search').addEventListener('click', () => {
      document.getElementById('status').innerHTML =
        '<div class="spinner" role="progressbar" aria-label="Searching"></div>';
    });
  </script>
</body>
</html>
