<!doctype html>
<html>
<head><meta charset="utf-8"><title>Account</title></head>
<body>
  <h1>Account</h1>
  <!-- Secret fields that misbehave: one keeps only four characters, one is
       revealed by a toggle, and a status line echoes what was typed. -->
  <label>Short PIN <input type="password" id="short" maxlength="4"></label>
  <label>New password <input type="password" id="reveal"></label>
  <button type="button" onclick="document.getElementById('reveal').type = 'text'">Show password</button>
  <p id="echo"></p>
  <script>
    document.getElementById('reveal').addEventListener('input', event => {
      document.getElementById('echo').textContent = 'You typed ' + event.target.value;
    });
  </script>
</body>
</html>
