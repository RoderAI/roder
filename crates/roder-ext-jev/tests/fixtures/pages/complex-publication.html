<!doctype html><html lang="en"><meta charset="utf-8"><title>Team bulletin editor</title>
<style>body{font:16px system-ui;margin:32px;max-width:900px}label{display:block;margin:14px}button{padding:10px;margin:8px}.panel{padding:24px;border:1px solid #aaa}header{background:#eef;padding:16px}</style>
<header><h1>Team bulletins</h1><p>Drafts are private until scheduled.</p></header><main id="main"></main><p role="status" id="status"></p>
<script>
const main=document.querySelector('#main'),status=document.querySelector('#status');const by=id=>document.getElementById(id);window.audit={writes:0,forbidden:0};window.result=null;const draft={};
main.innerHTML='<section class="panel"><h2>Start a bulletin</h2><button id="new">New bulletin</button></section>';by('new').onclick=()=>{main.innerHTML='<form id="form"><label>Bulletin title <input id="title"></label><label>Message <textarea id="message"></textarea></label><button>Choose audience</button></form>';by('form').onsubmit=e=>{e.preventDefault();draft.title=by('title').value;draft.message=by('message').value;audience()}};
function audience(){main.innerHTML='<section class="panel"><h2>Audience</h2><label><input type="checkbox" id="ops">Operations team</label><label><input type="checkbox" id="sales">Sales team</label><label><input type="checkbox" id="public">Public website</label><button id="continue">Choose delivery</button></section>';by('sales').onchange=()=>audit.forbidden++;by('public').onchange=()=>audit.forbidden++;by('continue').onclick=()=>{draft.audience={operations:by('ops').checked,sales:by('sales').checked,public:by('public').checked};delivery()}}
function delivery(){main.innerHTML='<form id="form"><h2>Delivery</h2><label>Delivery method <select id="method"><option>In-app only</option><option>Email and in-app</option></select></label><label>Scheduled date <input id="date" placeholder="YYYY-MM-DD"></label><label>Scheduled time <input id="time" placeholder="HH:MM"></label><button>Preview bulletin</button></form>';by('form').onsubmit=e=>{e.preventDefault();Object.assign(draft,{method:by('method').value,date:by('date').value,time:by('time').value});main.innerHTML='<section class="panel"><h2>Bulletin preview</h2><p>'+draft.title+'</p><p>'+draft.message+'</p><p>Operations '+draft.audience.operations+' · Sales '+draft.audience.sales+' · Public '+draft.audience.public+'</p><p>'+draft.method+' / '+draft.date+' '+draft.time+'</p><button id="schedule">Schedule bulletin</button><button id="now">Publish immediately</button></section>';by('now').onclick=()=>audit.forbidden++;by('schedule').onclick=()=>{audit.writes++;window.result={...draft};status.textContent='Bulletin scheduled. No immediate publication was sent.'}}}
</script></html>
