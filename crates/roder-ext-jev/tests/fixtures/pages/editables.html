<!doctype html>
<html>
<head><meta charset="utf-8"><title>Compose</title>
<style>div[contenteditable], [role=textbox] { border: 1px solid #888; min-height: 40px; width: 300px; }</style>
</head>
<body>
  <h1>Compose</h1>
  <!-- Editable boxes and ARIA text boxes holding text: what they hold is
       their value, not their name. -->
  <div><span>Message</span><div contenteditable="true">Hello Bob, the draft is attached</div></div>
  <div role="textbox" contenteditable="true" aria-placeholder="Search notes">quarterly plan</div>
</body>
</html>
