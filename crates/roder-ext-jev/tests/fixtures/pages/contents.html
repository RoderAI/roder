<!doctype html>
<html>
<head><meta charset="utf-8"><title>Shop</title>
<style>
  .card { border: 1px solid #ccc; padding: 8px; width: 200px; margin: 8px; }
  a.whole { display: contents; }
  span.wrap { display: contents; }
</style>
</head>
<body>
  <h1>Shop</h1>
  <!-- A link laid out with display:contents around a whole card, and text
       inside a display:contents wrapper: neither has a box of its own. -->
  <a class="whole" href="basic.html"><div class="card">Blue lamp</div></a>
  <p><span class="wrap">Price: 12 EUR</span></p>
</body>
</html>
