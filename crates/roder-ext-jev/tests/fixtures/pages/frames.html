<!doctype html>
<html>
<head><meta charset="utf-8"><title>Framed newsletter</title>
<style>
  iframe { display: block; margin: 8px 0; }
  #form { width: 520px; height: 260px; border: 4px solid #888; padding: 6px; }
  #scaled { width: 400px; height: 120px; border: 0; transform: scale(0.5); transform-origin: 0 0; }
  #remote { width: 400px; height: 90px; border: 1px dashed #aaa; }
</style>
</head>
<body>
  <h1>Framed newsletter</h1>
  <iframe id="form" src="frame-form.html" title="Signup"></iframe>
  <iframe id="scaled" src="frame-button.html?label=Accept%20terms" title="Terms"></iframe>
  <iframe id="remote" title="Remote"></iframe>
  <p id="status">Not subscribed yet.</p>
  <script>
    // The same server under another host name: a cross-origin frame.
    document.getElementById('remote').src =
      'http://localhost:' + location.port + '/pages/frame-button.html?label=Remote%20button';
  </script>
</body>
</html>
