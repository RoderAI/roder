<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie search</title>
<style>
  body { font: 14px sans-serif; }
  th { text-align: right; font-weight: normal; }
  .field { margin: 4px 0; }
  .note { font-size: 12px; color: #555; }
</style>
</head>
<body>
<h1>Movie search</h1>
<!-- No field has a label tied to it: one has a label with no "for", one a
     header cell in its row, one text after it. -->
<form method="post" action="/submit/movies">
  <div class="field"><label>Genre</label> <input type="text" name="genre"></div>
  <table><tr><th>Director</th><td><input type="text" name="director"></td></tr></table>
  <div class="field"><input type="text" name="year"> <span class="note">Release year</span></div>
  <button type="submit">Search</button>
</form>
</body>
</html>
