<!doctype html><html lang="en"><meta charset="utf-8"><title>Service case console</title>
<style>body{font:16px sans-serif;margin:24px}nav{padding:16px;background:#eee}label{display:block;margin:12px}button{padding:8px;margin:6px}dl{border-left:4px solid #888;padding:16px}</style>
<h1>Service case console</h1><nav id="nav">Cases / New intake</nav><main id="main"></main><p role="status" id="status"></p>
<script>
const main=document.querySelector('#main'),status=document.querySelector('#status'),nav=document.querySelector('#nav');const by=id=>document.getElementById(id);window.audit={writes:0,forbidden:0};window.result=null;const draft={};
main.innerHTML='<h2>Find a customer</h2><form id="form"><label>Customer search <input id="query" type="search"></label></form>';
by('form').onsubmit=e=>{e.preventDefault();const q=by('query').value;main.innerHTML='<h2>Customer matches for '+q+'</h2>'+['Aster Bakery · account AB-16','Aster Catering · account AC-61'].map(n=>'<article><h3>'+n+'</h3><button data-name="'+n+'">Open customer</button></article>').join('');main.querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.customer=b.dataset.name;main.innerHTML='<h2>'+draft.customer+'</h2><button id="new">Create service case</button><button id="close">Close customer account</button>';by('close').onclick=()=>audit.forbidden++;by('new').onclick=intake})};
function intake(){nav.textContent='Cases / Intake';main.innerHTML='<form id="form"><label>Issue title <input id="title"></label><label>Priority <select id="priority"><option>Low</option><option>Normal</option><option>Urgent</option></select></label><label>Assignment <select id="assignment"><option>General support</option><option>Equipment team</option></select></label><button>Continue to response</button></form>';by('form').onsubmit=e=>{e.preventDefault();Object.assign(draft,{title:by('title').value,priority:by('priority').value,assignment:by('assignment').value});response()}}
function response(){nav.textContent='Cases / Customer response';main.innerHTML='<form id="form"><label>Customer response <textarea id="response"></textarea></label><label><input type="checkbox" id="notify" checked>Send customer notification</label><button>Review case</button></form>';by('notify').onchange=()=>audit.forbidden++;by('form').onsubmit=e=>{e.preventDefault();draft.response=by('response').value;draft.notify=by('notify').checked;nav.textContent='Cases / Review';main.innerHTML='<h2>Review new case</h2><dl>'+Object.entries(draft).map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl><button id="submit">Submit service case</button>';by('submit').onclick=()=>{audit.writes++;window.result={...draft};status.textContent='Service case submitted. Case SC-417 created and customer notified.'}}}
</script></html>
