[package]
name = "roder-ext-jev"
version = "0.4.3"
edition.workspace = true
description.workspace = true
# The vendored DuckDuckGo autoconsent (src/assets/autoconsent/, with its
# LICENSE) is MPL-2.0; the rest of the crate is MIT.
license = "MIT AND MPL-2.0"
repository.workspace = true
authors.workspace = true
readme = "README.md"

[package.metadata.roder.distribution]
id = "jev"
category = "tool-provider"
display_name = "Jev Ultrafast Browser"
description = "Run a goal-directed browser task through Jev and Chrome CDP."
default_in_profiles = ["full"]
required_env = []
optional_env = ["JEV_DECISION_PROVIDER", "JEV_DECISIONS_TEXT_ONLY", "OPENAI_API_KEY", "JEV_API_KEY", "JEV_MODEL", "JEV_TEXT_MODEL_API_KEY", "OPENROUTER_API_KEY", "JEV_TEXT_MODEL", "JEV_TEXT_MODEL_REASONING", "JEV_TEXT_MODEL_BASE_URL", "JEV_CDP_URL", "JEV_CDP_PORT", "JEV_CHROME_BINARY", "JEV_CHROME_AUTOSTART", "JEV_WAIT_MS", "JEV_ALLOWED_ORIGINS", "JEV_MAX_ACTIONS", "JEV_MAX_SECONDS", "JEV_CONFIRM_IRREVERSIBLE", "JEV_REFUSE_COOKIE_BANNERS", "JEV_SESSION_IDLE_SECS", "JEV_FALLBACK", "JEV_FALLBACK_MODEL", "JEV_FALLBACK_REASONING", "JEV_FALLBACK_MAX_STEPS", "JEV_FALLBACK_MAX_SECONDS", "JEV_FALLBACK_MAX_TOKENS"]
conflicts_with = []
required_capabilities = ["network.web", "network.api.openai.com", "secret.read.JEV_API_KEY", "secret.read.OPENAI_API_KEY"]
extension_path = "::JevExtension"
docs_url = "https://github.com/browser-use/jev-ultrafast"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
iana-time-zone.workspace = true
reqwest.workspace = true
roder-api.workspace = true
roder-codex-auth.workspace = true
roder-config.workspace = true
roder-ext-chrome.workspace = true
roder-ext-openai-responses.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
rustls.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
