name: Prepare release PR

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Open or update the release preview PR
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'RoderAI' &&
      !contains(github.event.head_commit.message, 'chore: prepare release')
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      # Fails harmlessly at the commit step when there are no pending changesets.
      - name: Run knope prepare-release
        run: knope prepare-release --verbose
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub holds pull_request runs started by github-actions[bot] for
      # maintainer approval, and they expire as failures. Runs dispatched with
      # GITHUB_TOKEN start without approval and report on the same head commit.
      - name: Run release PR checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin knope/release > /dev/null; then
            echo "No release PR branch; nothing to check."
            exit 0
          fi
          gh workflow run cli-npm-check.yml --ref knope/release
          gh workflow run openclaw.yml --ref knope/release
