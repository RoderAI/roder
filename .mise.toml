[tools]
python = "3.12"
rust = "1.95.0"
uv = "0.11.7"
sccache = "0.15.0"

[env]
# One build directory for every checkout and worktree. Third-party dependencies
# compile once and are reused; only workspace crates (whose cache key includes
# the checkout path) rebuild per worktree. Matches ~/.zshenv and vex-git.
CARGO_TARGET_DIR = "{{env.HOME}}/.cargo-target.noindex"

# Off for the same reason as .cargo/config.toml: incremental state is per
# worktree path and unbounded in a shared target dir.
CARGO_INCREMENTAL = "0"

# sccache keeps compiled output outside any target dir, so a deleted or wiped
# target dir (or a fresh worktree) costs a warm rebuild instead of a cold one,
# and all worktrees share one cache. The name is emitted only once sccache is
# actually installed; an empty value means "no wrapper" to Cargo, whereas a
# hardcoded "sccache" would fail every cargo command on a machine without it.
# The mise install dir is probed directly because calling `mise` from inside an
# env template deadlocks.
RUSTC_WRAPPER = "{{ exec(command='if command -v sccache >/dev/null 2>&1 || ls \"${MISE_DATA_DIR:-$HOME/.local/share/mise}/installs/sccache\"/*/*/sccache >/dev/null 2>&1; then echo sccache; fi') | trim }}"
# Same cache dir as vex-git, so identical dependency compiles are shared.
SCCACHE_DIR = "{{env.HOME}}/.cache/sccache"
SCCACHE_CACHE_SIZE = "20G"
# A cache read/write fault degrades to a normal compile instead of failing it.
SCCACHE_IGNORE_SERVER_IO_ERROR = "1"
# Without this the server exits after ~10 minutes idle and the next build
# silently starts a replacement configured from whatever env it inherits.
SCCACHE_IDLE_TIMEOUT = "0"

# Homebrew lld (user-installed, macOS); mise enter ensures these bins are on
# PATH. Missing entries are ignored, so this is inert on Linux, where lld comes
# from the system package manager instead.
_.path = [
    "{{env.HOME}}/opt/homebrew/opt/lld/bin",
    "{{env.HOME}}/opt/homebrew/bin",
]
# Used by local scripts; cargo uses lld from PATH via .cargo/config.toml (-fuse-ld=lld).
LLD_PREFIX = "{{env.HOME}}/opt/homebrew/opt/lld"

[hooks]
# Ensure a linker is present when entering the project directory. .cargo/config.toml
# links Linux builds through `clang -fuse-ld=lld`, so a missing lld fails every
# build with "invalid linker name in argument '-fuse-ld=lld'". Installing it needs
# root on Linux, so name the command instead of failing the hook.
enter = "sh scripts/ensure-lld.sh"

[tasks.build]
description = "Build the local roder binary used by tests"
run = "make build"

[tasks.install]
description = "Install the roder binary into BINDIR"
run = "make install"

[tasks."rust:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks."rust:fmt:fix"]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."rust:clippy"]
description = "Run Rust clippy across the workspace"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."rust:test"]
description = "Run Rust tests across the workspace (nextest + app-server e2e)"
run = "make test"

[tasks."rust:test:fast"]
description = "Run unit tests only (skip integration binaries)"
run = "make test-fast"

[tasks."rust:setup"]
description = "Install Rust build tools (nextest) and ensure a working linker"
run = [
    "sh scripts/ensure-lld.sh",
    "make dev-deps",
]

[tasks."python:sync"]
description = "Install/sync Python e2e test dependencies"
dir = "e2e"
run = "uv sync --group dev"

[tasks."python:test"]
description = "Run Python e2e tests"
depends = ["build", "python:sync"]
dir = "e2e"
run = "uv run pytest"

[tasks."python:test:startup"]
description = "Run a fast Python e2e startup smoke test"
depends = ["build", "python:sync"]
dir = "e2e"
run = "uv run pytest tests/test_startup.py -v"

[tasks."python:snapshots"]
description = "Refresh Python e2e visual snapshots"
depends = ["build", "python:sync"]
dir = "e2e"
run = "uv run pytest --snapshot-update"

[tasks.check]
description = "Run formatting, clippy, and Rust tests"
depends = ["rust:fmt", "rust:clippy", "rust:test"]

[tasks.test]
description = "Run Rust and Python tests"
depends = ["rust:test", "python:test"]

[tasks.ci]
description = "Run the full local verification stack"
depends = ["rust:fmt", "rust:clippy", "rust:test", "python:test"]
