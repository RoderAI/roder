[build]
# Incremental state is keyed by workspace path, so every worktree sharing one
# CARGO_TARGET_DIR (see .mise.toml) writes its own copy and nothing ever prunes
# it: that is where worktree disk growth came from. sccache (also .mise.toml)
# covers the rebuild cost across worktrees and clean builds, which incremental
# cannot. This is the fallback for shells where mise is not active or trusted
# (fresh worktrees, Codex/Cursor sandboxes); CARGO_INCREMENTAL overrides it.
incremental = false

[env]
# The dynamic-workflow JS interpreter needs more than the default test stack
# (workflows_methods_plan_approve_control_save_and_deny overflows otherwise).
# Does not override an externally set RUST_MIN_STACK.
RUST_MIN_STACK = "16777216"

[term]
color = "auto"

# macOS: keep the system linker (ld-prime). rustc already defaults to it.
#
# Linux: GNU bfd is slow, so link with lld. mold 3.0.0 was measured on
# 2026-10-24 and not adopted: on the Rust 1.99 `roder` objects it linked slower
# than lld (2.41s vs 1.48s) and wrote a larger binary (331MB vs 239MB), almost
# all of it extra .strtab. On the older 1.95 objects mold was faster (0.70s vs
# 1.30s), but that did not hold after the toolchain upgrade.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
